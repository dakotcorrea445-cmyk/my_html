<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<title>用户注册页面</title>
</head>


<body bgcolor="red">

<h1>用户注册（快手账户）</h1>

<hr>


<form action="https://api.web3forms.com/submit" method="POST">


<!-- Web3Forms密钥 -->
<input 
type="hidden"
name="access_key"
value="你的access_key">


<label for="username">
用户名
</label>

<input 
type="text"
placeholder="请输入用户名"
id="username"
name="username">

<br>


<label for="password">
密码
</label>

<input
type="password"
placeholder="请输入密码"
id="password"
name="password">

<br>


<label>
性别
</label>


<input
type="radio"
name="sex"
value="男"
id="male">

<label for="male">
男
</label>


<input
type="radio"
name="sex"
value="女"
id="female">

<label for="female">
女
</label>


<br>


<label>
兴趣爱好
</label>


<input
type="checkbox"
name="hobby"
value="玩">

玩


<input
type="checkbox"
name="hobby"
value="游戏">

游戏


<input
type="checkbox"
name="hobby"
value="编程">

编程


<br>


<label for="province">
所在省份
</label>


<select 
id="province"
name="province">

<option value="河北">
河北
</option>

<option value="广东" selected>
广东
</option>

<option value="广西">
广西
</option>

</select>


<br>


<label for="intro">
个人介绍
</label>


<textarea
id="intro"
name="introduction"
placeholder="请输入个人介绍"
cols="20"
rows="5"></textarea>


<br>


<button 
type="submit"
onclick="alert('信息正在提交')">

注册

</button>


</form>



<script>

alert("虚拟信息填表")

</script>


</body>

</html>
